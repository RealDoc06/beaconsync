name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Frontend placeholder for tauri::generate_context
        run: mkdir -p apps/desktop/dist && touch apps/desktop/dist/index.html
      - run: cargo test -p beacon-core -p beacon-hub -p beacon-cli
      - run: cargo clippy --workspace -- -D warnings

  # The desktop app and CLI must build on every platform we ship.
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Frontend placeholder for tauri::generate_context
        shell: bash
        run: mkdir -p apps/desktop/dist && touch apps/desktop/dist/index.html
      - run: cargo test -p beacon-core -p beacon-cli
      - run: cargo build -p beaconsync-desktop -p beacon-hub

  desktop-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  companion-mod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mods/companion-fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
