name: Release

# Pushing a v* tag builds everything into a draft release, then publishes it once every job passed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      # One draft per tag; its id goes to tauri-action, which can't look drafts up by tag.
      - name: Create draft release
        id: draft
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --draft --title "BeaconSync ${GITHUB_REF_NAME}" --notes "Alpha build. See README for setup."
          echo "id=$(gh release view "${GITHUB_REF_NAME}" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"
          # Served as releases/latest/download/install.sh for `curl ... | bash`.
          gh release upload "${GITHUB_REF_NAME}" install.sh --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  cli-and-hub:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, zig: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, zig: true }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Frontend placeholder for the workspace
        shell: bash
        run: mkdir -p apps/desktop/dist && touch apps/desktop/dist/index.html
      - name: Build (static musl via zig)
        if: matrix.zig
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked
          cargo zigbuild --release --target ${{ matrix.target }} -p beacon-cli -p beacon-hub
      - name: Build
        if: ${{ !matrix.zig }}
        run: cargo build --release --target ${{ matrix.target }} -p beacon-cli -p beacon-hub
      - name: Package
        shell: bash
        run: |
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          mkdir -p out
          cp target/${{ matrix.target }}/release/beacon$ext out/beacon-${{ matrix.target }}$ext
          cp target/${{ matrix.target }}/release/beacon-hub$ext out/beacon-hub-${{ matrix.target }}$ext
          gh release upload "${GITHUB_REF_NAME}" out/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      # Handed to hub-image directly: a draft release isn't visible to its read-only token.
      - name: Keep the hub binary for the image
        if: endsWith(matrix.target, '-linux-musl')
        uses: actions/upload-artifact@v4
        with:
          name: hub-${{ matrix.target }}
          path: out/beacon-hub-${{ matrix.target }}
          retention-days: 1

  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.release.outputs.id }}

  # Universal app, signed with the Developer ID and notarized. Secrets live in the `release`
  # environment, which only v* tags can use.
  desktop-macos:
    needs: release
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Build, sign and notarize
        run: |
          export NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$NOTARY_KEY_PATH"
          scripts/release-macos.sh
        env:
          # Tauri imports the certificate into a throwaway keychain and signs with it.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - run: gh release upload "${GITHUB_REF_NAME}" target/universal-apple-darwin/release/bundle/dmg/*.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  companion-mod:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
        working-directory: mods/companion-fabric
      - name: Upload (versioned + stable name used by the app)
        run: |
          for mc in 1.21.1 26.3; do
            jar=$(ls mods/companion-fabric/build/libs/beaconsync-companion-*+$mc.jar | head -1)
            cp "$jar" beaconsync-companion-$mc.jar
            gh release upload "${GITHUB_REF_NAME}" "$jar" beaconsync-companion-$mc.jar --clobber
          done
        env:
          GH_TOKEN: ${{ github.token }}

  # ghcr.io/realdoc06/beacon-hub:<version> and :latest, packing the static musl builds above.
  hub-image:
    needs: cli-and-hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hub-*-linux-musl
          path: hub-bin
          merge-multiple: true
      - name: Name the hub binaries by Docker arch
        run: |
          mv hub-bin/beacon-hub-x86_64-unknown-linux-musl hub-bin/beacon-hub-amd64
          mv hub-bin/beacon-hub-aarch64-unknown-linux-musl hub-bin/beacon-hub-arm64
          chmod +x hub-bin/*
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/hub.release.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/realdoc06/beacon-hub:${{ github.ref_name }}
            ghcr.io/realdoc06/beacon-hub:latest

  publish:
    needs: [cli-and-hub, desktop, desktop-macos, companion-mod, hub-image]
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
