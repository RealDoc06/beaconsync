[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/hub", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0-alpha.14"
edition = "2024"
license = "MIT"
repository = "https://github.com/RealDoc06/beaconsync"

[workspace.dependencies]
beacon-core = { path = "crates/core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
rand = "0.8"

# Keep debug builds small: line tables for our code, no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
