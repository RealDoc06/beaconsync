plugins { id 'net.fabricmc.fabric-loom' }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 26.x ships unobfuscated: no mappings, no remapping, plain implementation configurations.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    ['fabric-api-base', 'fabric-command-api-v2', 'fabric-lifecycle-events-v1', 'fabric-networking-api-v1'].each {
        implementation fabricApi.module(it, project.fabric_api_version)
    }
}

apply from: rootProject.file('target.gradle')
